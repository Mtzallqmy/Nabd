services:
  nabd:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:?Set TELEGRAM_ADMIN_IDS in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/nabd.db}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
