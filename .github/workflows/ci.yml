name: NABD Phase 01 checks
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nabd_test
          POSTGRES_USER: nabd
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nabd -d nabd_test"
          --health-interval 5s --health-timeout 4s --health-retries 10
    env:
      NABD_TEST_POSTGRES_URL: postgresql+psycopg://nabd:local_ci_only@127.0.0.1:5432/nabd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and validate sources
        run: |
          python -m pip install -r requirements-dev.txt pip-audit
          python -m compileall -q app tests scripts alembic
          ruff check .
          ruff format --check .
          python -m pytest -q
          python scripts/build_handoff.py
          python scripts/verify_handoff.py
          pip-audit -r requirements-dev.txt
      - name: Scan tracked sources for secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" zricethezav/gitleaks:v8.24.3 \
            dir /repo --redact
      - name: Build and smoke-test Docker image
        run: |
          docker compose version
          BOT_TOKEN=123456789:TEST_FAKE_TOKEN TELEGRAM_ADMIN_IDS=123456789 docker compose config -q
          docker build -t nabd-phase01:test .
          docker run --detach --name nabd-smoke --network none \
            -e BOT_TOKEN=123456789:TEST_FAKE_TOKEN -e TELEGRAM_ADMIN_IDS=123456789 \
            -e DATABASE_URL=sqlite+aiosqlite:////app/data/smoke.db nabd-phase01:test \
            sh -c 'python -m alembic upgrade head && exec python -m app.main'
          trap 'docker logs nabd-smoke; docker rm -f nabd-smoke' EXIT
          for attempt in {1..20}; do
            if docker exec nabd-smoke python -c '
          import json
          import urllib.error
          import urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8080/healthz", timeout=2)
          except urllib.error.HTTPError as response:
              assert response.code == 503
              assert json.load(response)["database"] == "ok"
          else:
              raise AssertionError("Telegram is deliberately offline")
          '; then exit 0; fi
            sleep 1
          done
          exit 1
